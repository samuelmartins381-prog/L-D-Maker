# yaml-language-server: $schema=../../packages/schema/module.schema.json
# Demo module (non-confidential) used to exercise the whole pipeline.
schemaVersion: "0.1"
id: phishing-basics
version: 0.1.0
defaultLocale: fr
locales: [fr, en, ar, de, es, it, pt-BR, ru, ja, zh-Hans, ko]

meta:
  title: meta.title
  description: meta.description
  durationMinutes: 15

objectives:
  - id: obj-signs
    bloom: understand
    text: obj.signs
  - id: obj-react
    bloom: apply
    text: obj.react

assessment:
  passingScore: 80
  completion: all-screens-and-passed

sections:
  - id: s1
    title: s1.title
    screens:
      - id: s1-welcome
        title: s1.welcome.title
        blocks:
          - id: s1-welcome-intro
            type: narrative
            heading: s1.welcome.heading
            body: s1.welcome.body
          - id: s1-welcome-goals
            type: summary
            heading: s1.goals.heading
            points: [obj.signs, obj.react]

  - id: s2
    title: s2.title
    screens:
      - id: s2-signals
        title: s2.signals.title
        blocks:
          - id: s2-signals-list
            type: accordion
            intro: s2.signals.intro
            items:
              - { id: sender, title: s2.signal.sender.title, body: s2.signal.sender.body }
              - { id: urgency, title: s2.signal.urgency.title, body: s2.signal.urgency.body }
              - { id: links, title: s2.signal.links.title, body: s2.signal.links.body }
              - { id: attachments, title: s2.signal.attachments.title, body: s2.signal.attachments.body }
              - { id: requests, title: s2.signal.requests.title, body: s2.signal.requests.body }
      - id: s2-example
        title: s2.example.title
        blocks:
          - id: s2-example-email
            type: narrative
            heading: s2.example.heading
            body: s2.example.body
      - id: s2-anatomy
        title: s2.anatomy.title
        blocks:
          - id: s2-anatomy-email
            type: hotspots
            intro: s2.anatomy.intro
            image: { src: media/email-anatomy.svg, alt: s2.anatomy.alt }
            items:
              - { id: sender, x: 52, y: 23, title: s2.anatomy.sender.title, body: s2.anatomy.sender.body }
              - { id: subject, x: 66, y: 36, title: s2.anatomy.subject.title, body: s2.anatomy.subject.body }
              - { id: link, x: 77.5, y: 73, title: s2.anatomy.link.title, body: s2.anatomy.link.body }
              - { id: attachment, x: 39.5, y: 87.5, title: s2.anatomy.attachment.title, body: s2.anatomy.attachment.body }
      - id: s2-practice
        title: s2.practice.title
        blocks:
          - id: s2-practice-q
            type: question
            variant: multiple
            scored: false
            attempts: 2
            prompt: s2.practice.prompt
            objectives: [obj-signs]
            choices:
              - { id: a, text: s2.practice.a, correct: true, feedback: s2.practice.a.fb }
              - { id: b, text: s2.practice.b, correct: false, feedback: s2.practice.b.fb }
              - { id: c, text: s2.practice.c, correct: true, feedback: s2.practice.c.fb }

  - id: s3
    title: s3.title
    screens:
      - id: s3-react
        title: s3.react.title
        blocks:
          - id: s3-react-steps
            type: tabs
            intro: s3.react.intro
            items:
              - { id: stop, title: s3.step.stop.title, body: s3.step.stop.body }
              - { id: report, title: s3.step.report.title, body: s3.step.report.body }
              - { id: clicked, title: s3.step.clicked.title, body: s3.step.clicked.body }

  - id: s4
    title: s4.title
    screens:
      - id: s4-quiz
        title: s4.quiz.title
        blocks:
          - id: q-sender
            type: question
            variant: single
            prompt: q.sender.prompt
            objectives: [obj-signs]
            choices:
              - { id: a, text: q.sender.a, correct: false, feedback: q.sender.a.fb }
              - { id: b, text: q.sender.b, correct: true, feedback: q.sender.b.fb }
              - { id: c, text: q.sender.c, correct: false, feedback: q.sender.c.fb }
          - id: q-signals
            type: question
            variant: multiple
            prompt: q.signals.prompt
            objectives: [obj-signs]
            choices:
              - { id: a, text: q.signals.a, correct: true, feedback: q.signals.a.fb }
              - { id: b, text: q.signals.b, correct: true, feedback: q.signals.b.fb }
              - { id: c, text: q.signals.c, correct: false, feedback: q.signals.c.fb }
              - { id: d, text: q.signals.d, correct: false, feedback: q.signals.d.fb }
          - id: q-link
            type: question
            variant: single
            prompt: q.link.prompt
            objectives: [obj-signs]
            choices:
              - { id: a, text: q.link.a, correct: false, feedback: q.link.a.fb }
              - { id: b, text: q.link.b, correct: true, feedback: q.link.b.fb }
              - { id: c, text: q.link.c, correct: false, feedback: q.link.c.fb }
          - id: q-report
            type: question
            variant: single
            prompt: q.report.prompt
            objectives: [obj-react]
            choices:
              - { id: a, text: q.report.a, correct: false, feedback: q.report.a.fb }
              - { id: b, text: q.report.b, correct: true, feedback: q.report.b.fb }
              - { id: c, text: q.report.c, correct: false, feedback: q.report.c.fb }
          - id: q-verify
            type: question
            variant: single
            prompt: q.verify.prompt
            objectives: [obj-react]
            choices:
              - { id: a, text: q.verify.a, correct: false, feedback: q.verify.a.fb }
              - { id: b, text: q.verify.b, correct: false, feedback: q.verify.b.fb }
              - { id: c, text: q.verify.c, correct: true, feedback: q.verify.c.fb }
          - id: q-react
            type: question
            variant: single
            prompt: q.react.prompt
            objectives: [obj-react]
            choices:
              - { id: a, text: q.react.a, correct: false, feedback: q.react.a.fb }
              - { id: b, text: q.react.b, correct: false, feedback: q.react.b.fb }
              - { id: c, text: q.react.c, correct: true, feedback: q.react.c.fb }
      - id: s4-recap
        title: s4.recap.title
        blocks:
          - id: s4-recap-points
            type: summary
            heading: s4.recap.heading
            points: [s4.recap.p1, s4.recap.p2, s4.recap.p3, s4.recap.p4]
